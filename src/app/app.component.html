<ion-app>
  <!-- Side Menu (Drawer) -->
  <ion-menu contentId="main-content" menuId="main-menu">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Menu List</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list lines="full">
        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/tabs/dashboard" routerDirection="root">
            <ion-icon slot="start" name="home-outline"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>

          <ion-item routerLink="/tabs/produk" routerDirection="root">
            <ion-icon slot="start" name="list-outline"></ion-icon>
            <ion-label>Produk</ion-label>
          </ion-item>

          <ion-item routerLink="/tabs/transaksi" routerDirection="root">
            <ion-icon slot="start" name="document-text-outline"></ion-icon>
            <ion-label>Transaksi</ion-label>
          </ion-item>

          <ion-item routerLink="/tabs/profile" routerDirection="root">
            <ion-icon slot="start" name="person-outline"></ion-icon>
            <ion-label>Profile</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- Router Outlet utama -->
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
