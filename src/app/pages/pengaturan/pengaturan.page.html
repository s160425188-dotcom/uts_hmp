<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Pengaturan</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <!-- Toggle Dark Mode -->
    <ion-item>
      <ion-icon slot="start" name="moon-outline" color="primary"></ion-icon>
      <ion-label>
        <h2>Dark Mode</h2>
        <p>Ganti tema ke mode gelap/terang</p>
      </ion-label>
      <ion-toggle 
        slot="end" 
        [checked]="isDarkMode" 
        (ionChange)="toggleDarkMode($event)">
      </ion-toggle>
    </ion-item>

    <ion-item>
      <ion-icon slot="start" name="notifications-outline" color="primary"></ion-icon>
      <ion-label>Notifikasi Stok Habis</ion-label>
      <ion-toggle slot="end" checked></ion-toggle>
    </ion-item>
  </ion-list>
</ion-content>
